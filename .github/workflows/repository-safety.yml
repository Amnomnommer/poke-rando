name: Repository safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prohibit-game-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Python version
        run: python3 --version
      - name: Reject proprietary or generated game data
        run: bash scripts/check-repository-safety.sh
      - name: Run synthetic safety and pin tests
        run: python3 -I -m unittest discover -s tests -v
